name: verificação de pr

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configurar java (21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: testa o projeto
      run: mvn -B test --file pom.xml

    - name: Atualizar Labels do PR
      uses: actions/github-script@v7
      with:
          script: |
            const testStatus = '${{ steps.run_tests.outcome }}';
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: prInfo } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });

            const testLabelsToRemove = prInfo.labels
              .map(l => l.name)
              .filter(name => name.startsWith('tests-'));

            for (const labelName of testLabelsToRemove) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: labelName
              });
            }

            const newLabel = (testStatus === 'success') ? 'tests-passed' : 'tests-failed';
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [newLabel]
            });



          
      

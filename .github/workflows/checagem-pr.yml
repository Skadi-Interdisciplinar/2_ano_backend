name: verificação de pr

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configurar java (21)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: testa o projeto
      run: mvn -B test --file pom.xml

    - name: Adiciona label de sucesso no PR
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['tests-passed']
          })

    - name: Adiciona label de fracasso no PR
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.addLabels({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: ['tests-failed']
          })


          
      

spring.config.import=optional:file:.env[.properties]

spring.application.name=api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.timeout=10s
spring.data.redis.connect-timeout=10s
skadi.redis.temperature-stream=${REDIS_TEMPERATURE_STREAM:skadi:leituras:temperatura}
skadi.redis.temperature-retention-hours=${REDIS_TEMPERATURE_RETENTION_HOURS:72}


jwt.key=${SECURITY_KEY}
jwt.expiration=${EXPIRATION_TIME:3600}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:skadi.enterprise@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

